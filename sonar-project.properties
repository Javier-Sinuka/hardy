sonar.projectKey=Javier-Sinuka_hardy
sonar.organization=javier-sinuka

sonar.projectName=hardy
sonar.projectVersion=1.0

# Analizamos el código fuente del workspace.
sonar.sources=.

# Reporte de cobertura generado por cargo-llvm-cov.
sonar.rust.lcov.reportPaths=lcov.info

# Exclusiones para no analizar artefactos, caches, documentación generada,
# fuzz harnesses y pruebas de interoperabilidad pesadas.
sonar.exclusions=\
target/**,\
.git/**,\
.github/**,\
docs/**,\
**/target/**,\
**/fuzz/**,\
tests/interop/**,\
patches/**,\
**/*.lock

# Evitamos que Sonar calcule cobertura sobre archivos que no son lógica fuente principal.
sonar.coverage.exclusions=\
**/tests/**,\
tests/**,\
**/fuzz/**,\
**/tools/**,\
docs/**,\
**/build.rs

# Opcional: hacer fallar el pipeline si falla el Quality Gate.
# sonar.qualitygate.wait=true