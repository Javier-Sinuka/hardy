name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sonarcloud:
    name: Test, coverage and SonarQube Cloud scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Use cached dependencies and artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sonarcloud-ci

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace

      - name: Run workspace tests with coverage
        run: |
          cargo llvm-cov \
            --locked \
            --all-features \
            --workspace \
            --exclude storage-tests \
            --no-report

      - name: Start PostgreSQL and MinIO for storage tests
        run: |
          docker compose up -d --wait postgres minio

      - name: Create S3 test bucket
        run: |
          docker compose exec minio \
            mc alias set local http://localhost:9000 minioadmin minioadmin

          docker compose exec minio \
            mc mb --ignore-existing local/hardy-test

      - name: Run storage tests with coverage
        env:
          TEST_POSTGRES_URL: postgresql://hardy:hardy@localhost:5432
          TEST_S3_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: |
          cargo llvm-cov \
            --no-report \
            -p storage-tests \
            --locked \
            --features postgres,s3

      - name: Generate LCOV report
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path lcov.info

          test -s lcov.info
          ls -lh lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardy-lcov-report
          path: lcov.info
          if-no-files-found: error

      - name: Stop Docker services
        if: always()
        run: docker compose down -v

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}